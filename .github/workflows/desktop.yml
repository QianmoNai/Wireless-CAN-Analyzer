name: Desktop Linux and Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', 'android/app/src/main/assets/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'android/app/src/main/assets/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - name: Prepare private build draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_TAG: desktop-build-${{ github.run_id }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          if ! gh release view "$BUILD_TAG" >/dev/null 2>&1; then
            gh release create "$BUILD_TAG" --draft --target "$BUILD_SHA" \
              --title "Desktop build $GITHUB_RUN_NUMBER" \
              --notes 'Validated desktop build packages. Build draft only; not a complete project release.'
          fi
          echo "tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || github.event_name == 'pull_request') }}
    permissions:
      contents: write
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements-build.txt
      - run: python -m pip install -r desktop/requirements-build.txt
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libasound2t64 fonts-noto-cjk
      - run: python -m unittest discover -s desktop/tests -v
      - name: UI smoke test
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python desktop/main.py --smoke desktop/build/smoke.png
      - run: python desktop/build.py
      - name: Packaged UI smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: desktop/dist/CAN-Scope/CAN-Scope --smoke desktop/build/packaged.png
      - name: Packaged UI smoke test (Windows)
        timeout-minutes: 3
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        shell: pwsh
        run: |
          $p = Start-Process -FilePath desktop/dist/CAN-Scope/CAN-Scope.exe -ArgumentList '--smoke','desktop/build/packaged.png' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Store packages in Release draft
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python -c "from pathlib import Path; import hashlib; files=[*Path('desktop/dist').glob('*.zip'),*Path('desktop/dist').glob('*.tar.gz')]; assert files, 'No build packages'; [p.with_suffix(p.suffix+'.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n', encoding='ascii') for p in files]"
          for file in desktop/dist/*.tar.gz desktop/dist/*.zip desktop/dist/*.sha256; do
            if [ -f "$file" ]; then gh release upload "$BUILD_TAG" "$file" --clobber; fi
          done
      # Reports are temporary diagnostics. A storage-quota delay must not
      # turn successfully validated and delivered packages into a failed build.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: desktop-smoke-${{ runner.os }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            desktop/build/*.png
            desktop/build/*.json

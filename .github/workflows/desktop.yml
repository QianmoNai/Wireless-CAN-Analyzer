name: Desktop Linux and Windows
on:
  workflow_dispatch:
  push:
    paths: ['desktop/**', 'android/app/src/main/assets/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'android/app/src/main/assets/**', '.github/workflows/desktop.yml']
permissions:
  contents: write
jobs:
  build:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements-build.txt
      - run: python -m pip install -r desktop/requirements-build.txt
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libasound2t64 fonts-noto-cjk
      - run: python -m unittest discover -s desktop/tests -v
      - name: UI smoke test
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python desktop/main.py --smoke desktop/build/smoke.png
      - run: python desktop/build.py
      - name: Packaged UI smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: desktop/dist/CAN-Scope/CAN-Scope --smoke desktop/build/packaged.png
      - name: Packaged UI smoke test (Windows)
        timeout-minutes: 3
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        shell: pwsh
        run: |
          $p = Start-Process -FilePath desktop/dist/CAN-Scope/CAN-Scope.exe -ArgumentList '--smoke','desktop/build/packaged.png' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Save validated packages to private draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload desktop-v1.1.0-uart-build desktop/dist/*.sha256 --clobber
          for file in desktop/dist/*.tar.gz desktop/dist/*.zip; do
            if [ -f "$file" ]; then gh release upload desktop-v1.1.0-uart-build "$file" --clobber; fi
          done
      - name: Save smoke reports
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "import shutil; shutil.make_archive('desktop/build/desktop-smoke-${{ runner.os }}', 'zip', 'desktop/build', 'packaged.json')"
          gh release upload desktop-v1.1.0-uart-build desktop/build/desktop-smoke-${{ runner.os }}.zip --clobber

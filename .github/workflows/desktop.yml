name: Desktop Linux and Windows
on:
  workflow_dispatch:
  push:
    paths: ['desktop/**', 'android/app/src/main/assets/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'android/app/src/main/assets/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements-build.txt
      - run: python -m pip install -r desktop/requirements-build.txt
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libasound2t64 fonts-noto-cjk
      - run: python -m unittest discover -s desktop/tests -v
      - name: UI smoke test
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python desktop/main.py --smoke desktop/build/smoke.png
      - run: python desktop/build.py
      - name: Packaged UI smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: desktop/dist/CAN-Scope/CAN-Scope --smoke desktop/build/packaged.png
      - name: Packaged UI smoke test (Windows)
        timeout-minutes: 3
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        shell: pwsh
        run: |
          $p = Start-Process -FilePath desktop/dist/CAN-Scope/CAN-Scope.exe -ArgumentList '--smoke','desktop/build/packaged.png' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - uses: actions/upload-artifact@v4
        with:
          name: CAN-Scope-Desktop-${{ runner.os }}-x64
          path: |
            desktop/dist/*.tar.gz
            desktop/dist/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-${{ runner.os }}
          path: |
            desktop/build/*.png
            desktop/build/*.json

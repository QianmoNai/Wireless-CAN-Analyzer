<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备总览</title><style>
:root{color-scheme:dark;--bg:#0a0f19;--panel:#121d2b;--muted:#8d9caf;--line:#27364a;--cyan:#65e6cb}*{box-sizing:border-box}html{overflow-x:hidden}body{overflow-x:hidden;margin:0;background:var(--bg);color:#ecf2f9;font:14px system-ui,sans-serif}.home{max-width:1050px;margin:auto;padding:25px 18px 32px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}.home-actions{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}.connect-all{background:#172e35;color:var(--cyan);border:1px solid #356358;border-radius:12px;padding:10px 13px;font-weight:650;font-size:12px;white-space:nowrap}.connect-all:disabled{opacity:.5;cursor:default}#reconnectNotice{margin:-8px 0 18px;font-size:12px;color:var(--muted);line-height:1.7;overflow-wrap:anywhere}h1{font-size:25px;margin:0;letter-spacing:-.8px}header p{font-size:12px;color:var(--muted);margin:8px 0 0}button,select{font:inherit;color:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}.add{background:#65e6cb;color:#082d25;border:0;border-radius:12px;padding:11px 13px;font-weight:650;font-size:12px}.add:disabled{opacity:.4}#channels{display:flex;gap:8px;overflow:auto;padding:2px 1px 12px}.channel{white-space:nowrap;background:#162334;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12px}.channel span{color:var(--muted);margin-left:6px}.channel.online{border-color:#326156}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0 15px}.toolbar strong{font-size:14px}.toolbar select{max-width:180px;background:#111b29;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}.motor{touch-action:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;cursor:pointer;min-width:0}.motor:focus-visible{outline:2px solid var(--cyan)}.motor-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}.motor-heading .source{flex:1;min-width:0;white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}.motor-addresses{display:flex;flex-direction:column;align-items:stretch;gap:4px;flex:none;text-align:right}.feedback-id{white-space:nowrap;border:1px solid #344967;border-radius:6px;background:#172a42;color:#a9c5ff;padding:3px 5px;font-size:10px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.4}.motor-id{flex:none;white-space:nowrap;border:1px solid #356358;border-radius:6px;background:#19352f;color:var(--cyan);padding:3px 5px;font-size:10px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.4}.source{display:block;font-size:10px;color:#b3c3d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.8}.status{font-size:10px;display:inline-block;margin:9px 0;color:#91a0b7}.status.live{color:var(--cyan)}.status.stale{color:#ffbd83}.motor h2{font-size:16px;margin:14px 0 5px;overflow-wrap:anywhere}.model{color:var(--muted);font-size:10px;line-height:1.7;margin:0 0 14px}.values{display:grid;grid-template-columns:1fr;gap:10px}.values div{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px}.values small{font-size:10px;color:var(--muted)}.values strong{font-size:13px;font-weight:550;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.state{border-top:1px solid var(--line);padding-top:10px;margin:13px 0 0;font-size:10px;color:var(--muted);overflow-wrap:anywhere}.empty{padding:42px 18px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted);font-size:13px;line-height:1.8}.empty h2{font-size:17px;color:#dce7f6}.note{font-size:10px;color:var(--muted);line-height:1.7;margin-top:18px}[hidden]{display:none!important}@media(min-width:800px){.grid{grid-template-columns:repeat(3,1fr)}.values{grid-template-columns:1fr 1fr}.values div{display:block}.values strong{display:block;margin-top:4px}}@media(max-width:359px){.grid{grid-template-columns:1fr}}
.config-box{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:16px}.config-box summary{cursor:pointer;font-size:12px;color:#b3c3d8}.config-buttons{display:flex;gap:10px}.config-buttons button{flex:1}.config-buttons button:disabled{opacity:.4}
.query-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 6px;font-size:12px;cursor:pointer}.query-toggle{appearance:none;width:38px;height:22px;border-radius:20px;background:#344359;position:relative;flex:none;cursor:pointer}.query-toggle:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff}.query-toggle:checked{background:#65e6cb}.query-toggle:checked:after{left:19px;background:#10372b}.query-toggle:disabled{opacity:.4}.query-note{font-size:10px;color:#91a0b7;line-height:1.5;margin:5px 0 12px}
.query-frequency{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;font-size:12px;color:#91a0b7}.query-hz{width:76px;flex:none;min-height:36px;border:1px solid #344359;border-radius:8px;padding:6px 10px;background:#131e2d;color:#eef6ff;font:inherit;box-sizing:border-box}
.motor{position:relative;transition:border-color .18s,box-shadow .18s,background-color .18s; -webkit-tap-highlight-color:transparent}.motor.pressing{box-shadow:0 0 0 2px #65e6cb22;background:#182638}.motor.dragging{opacity:.18;border:1px dashed var(--cyan);box-shadow:inset 0 0 0 1px #65e6cb33}.drag-preview{position:fixed;top:0;left:0;z-index:1000;pointer-events:none;transform-origin:center;background:#182638;border:1px solid #65e6cb88;border-radius:18px;padding:15px;box-sizing:border-box;box-shadow:0 22px 52px #0009,0 5px 15px #0005;will-change:transform;contain:layout paint}.drag-preview h2{font-size:16px;margin:14px 0 5px;overflow-wrap:anywhere}.motor.swiping{will-change:transform;z-index:2}.motor.swipe-delete{border-color:#ff7185;box-shadow:0 0 20px #ff718518}.motor.swipe-edit{border-color:var(--cyan);box-shadow:0 0 20px #65e6cb18}.motor.swipe-delete::after,.motor.swipe-edit::after{content:attr(data-swipe-label);position:absolute;bottom:8px;left:12px;right:12px;text-align:center;font-size:11px;pointer-events:none}.motor.swipe-delete::after{color:#ff7185}.motor.swipe-edit::after{color:var(--cyan)}button{transition:transform .15s,background-color .18s,opacity .18s}button:active:not(:disabled){transform:scale(.96)}.status{transition:color .2s}.home{animation:home-in .24s ease-out}@keyframes home-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}#sortNotice{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;margin:0;padding:9px 15px;border:1px solid #356358;background:#122820ed;border-radius:20px;color:var(--cyan);pointer-events:none;white-space:nowrap;box-shadow:0 6px 24px #0005}@media(prefers-reduced-motion:reduce){.home{animation:none}button,.motor,.status{transition:none}}
.motor,.drag-preview{display:flex;flex-direction:column}.motor-footer{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:auto}.motor-footer .status{flex:1;min-width:0;margin:0;line-height:1.6}.motor-temperature{flex:none;text-align:right;white-space:nowrap}.motor-temperature small{display:block;color:var(--muted);font-size:9px;line-height:1.7}.motor-temperature strong{display:block;font-size:12px;font-weight:550;font-variant-numeric:tabular-nums;line-height:1.6}
.sort-tools{display:flex;gap:8px;align-items:center}.sort-tools select{max-width:125px}
</style></head><body><main class="home"><header><div><h1>设备总览</h1><p id="summary">正在载入通道…</p></div><div class="home-actions"><button class="connect-all" id="connectAll" title="连接各通道上次成功连接的设备">连接</button><button class="add" id="addChannel">＋ 设备</button></div></header><p id="reconnectNotice" role="status" hidden></p><details class="config-box"><summary>配置备份与恢复</summary><p class="note">备份通道、电机、RX/TX 保存上限及上次成功连接的设备。导入会替换当前全部通道配置，请先断开设备；恢复连接记录后可点首页“连接”；实时报文和反馈数值不备份。打开系统文件选择器时，App 会按后台规则断开蓝牙。</p><div class="config-buttons"><button id="exportConfig" class="channel">导出配置</button><button id="importConfig" class="channel">导入配置</button></div><p id="configStatus" class="note" role="status"></p></details><div id="channels" aria-label="设备通道"></div><div class="toolbar"><strong>电机与 IMU <span id="motorCount">0</span></strong><div class="sort-tools"><select id="filter" aria-label="筛选通道"><option value="all">所有通道</option></select></div></div><p id="sortNotice" class="note" role="status" hidden></p><div id="cards" class="grid"></div><div class="empty" id="empty" hidden><h2>添加你的第一台监控设备</h2><p>点击上方通道，连接 ESP32 并添加电机或 IMU。<br>所有通道的状态都会汇总到这里。</p></div><p class="note">首页显示连接状态和电机温度，约每秒更新；无最新温度反馈时显示“—”。点击查看详情，左滑删除，右滑配置，长按后拖动排序。电机在线表示近期收到匹配反馈，不代表已使能；达妙未开启查询时可能显示等待反馈。</p></main><script src="motors.js"></script><script src="config_io.js"></script><script src="home.js"></script></body></html>
